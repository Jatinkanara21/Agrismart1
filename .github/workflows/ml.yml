name: ML Service CI

on:
  push:
    branches: [main]
    paths:
      - 'ml_service/**'
      - '.github/workflows/ml.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml_service/**'
      - '.github/workflows/ml.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Train crop model
        run: python train_crop.py

      - name: Train fertilizer model
        run: python train_fertilizer.py

      - name: Train yield model
        run: python train_yield.py

      - name: Train pest risk model
        run: python train_pest.py

      - name: Verify trained models
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib

          fertilizer_path = Path("models/fertilizer_model.joblib")
          assert fertilizer_path.exists(), "Fertilizer model was not created"
          fertilizer = joblib.load(fertilizer_path)
          sample = [[20, 83, 26, "Clayey", "rice", 90, 49, 36]]
          prediction = fertilizer.predict(
              __import__("pandas").DataFrame(
                  sample,
                  columns=[
                      "Temparature", "Humidity", "Moisture", "Soil_Type",
                      "Crop_Type", "Nitrogen", "Potassium", "Phosphorous"
                  ],
              )
          )[0]
          assert isinstance(prediction, str) and prediction.strip()
          print(f"fertilizer_prediction={prediction}")
          print(f"fertilizer_classes={len(fertilizer.classes_)}")
          assert len(fertilizer.classes_) >= 2
          PY

      - name: Verify crop model
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib

          model_path = Path("models/crop_model.joblib")
          assert model_path.exists(), "Crop model was not created"

          model = joblib.load(model_path)
          prediction = model.predict([[80, 45, 40, 25, 82, 6.4, 220]])[0]
          assert isinstance(prediction, str) and prediction.strip(), "Model returned an invalid prediction"
          print(f"crop_prediction={prediction}")
          print(f"classes={len(model.classes_)}")
          assert len(model.classes_) >= 2, "Expected multiple crop classes"
          PY

      - name: Verify pest risk model
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib
          import pandas as pd

          model_path = Path("models/pest_model.joblib")
          assert model_path.exists(), "Pest model was not created"
          model = joblib.load(model_path)
          sample = pd.DataFrame([{
              "crop": "Cotton",
              "pest": "Whitefly",
              "temperature_c": 30.0,
              "humidity_pct": 70.0,
              "rainfall_mm": 120.0,
              "soil_moisture_pct": 45.0,
              "pest_count": 6.0,
              "etl": 5.0,
          }])
          prediction = model.predict(sample)[0]
          assert prediction in {"low", "medium", "high"}
          print(f"pest_risk={prediction}")
          PY

      - name: Validate API imports
        run: python -c "from app import app; print(app.title)"

      - name: Build production Docker image
        run: docker build --tag agrismart-ml:ci .

      - name: Verify Docker image metadata
        run: docker image inspect agrismart-ml:ci >/dev/null
