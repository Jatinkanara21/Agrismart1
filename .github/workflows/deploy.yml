name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Flutter Web
        env:
          AGRISMART_ML_BASE_URL: ${{ secrets.AGRISMART_ML_BASE_URL }}
        run: |
          if [ -z "$AGRISMART_ML_BASE_URL" ]; then
            echo "ERROR: AGRISMART_ML_BASE_URL GitHub Actions secret is required."
            exit 1
          fi
          flutter build web --release \
            --base-href "/Agrismart1/" \
            --dart-define=AGRISMART_ML_BASE_URL="$AGRISMART_ML_BASE_URL"

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
